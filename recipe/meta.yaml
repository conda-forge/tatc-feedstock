{% set name = "tatc" %}
{% set version = "3.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/code-lab-org/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4adbfb1746929fbbd772686809bf0739cbdee1909587325aa3352671493aca1c

build:
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - geopandas >=1.0
    - numba
    - numpy
    - pandas >=2.0
    - pydantic >=2.6
    - pyproj
    - pyyaml
    - shapely >=2.0.1
    - skyfield >=1.49
    - sgp4
    - spiceypy
    - typing-extensions

test:
  source_files:
    - tests
    - docs/validation/catalog_page.py
    - docs/validation/systems_page.py
  imports:
    - tatc
  requires:
    - python {{ python_min }}
    - pip
    - rasterio
  commands:
    - pip check
    - python -m unittest

about:
  home: https://github.com/code-lab-org/tatc
  summary: 'Tradespace Analysis Toolkit for Constellations (TAT-C)'
  description: |
    tatc provides low-level data structures and analysis functions for systems
    engineering design and trades of Earth-observing space systems with a
    focus on distributed missions and constellations.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://tatc.readthedocs.io/
  dev_url: https://github.com/code-lab-org/tatc

extra:
  recipe-maintainers:
    - ptgrogan
